name: Poll Zohara Agent builds

# Sends the newest green main build of Zohaib8090/zohara-agent to the ALPHA channel without any personal access token:
# this repository's own GITHUB_TOKEN may read the (public) source repository's runs and start publish.yml here.
# Every 20 minutes, and by hand. Each source run is sent once (publish.yml's run title holds the run id); beta and
# stable are never touched by this workflow.

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: Zohaib8090/zohara-agent
    steps:
      - name: Find the newest green build on main
        id: find
        run: |
          set -euo pipefail
          run="$(gh api "repos/$SRC/actions/workflows/build.yml/runs?branch=main&event=push&status=success&per_page=1" -q '.workflow_runs[0].id // empty')"
          [ -n "$run" ] || { echo "no green build found"; exit 0; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "newest green build: $run"
      - name: Send it to alpha unless it was sent before
        if: steps.find.outputs.run != ''
        env:
          RUN: ${{ steps.find.outputs.run }}
        run: |
          set -euo pipefail
          if gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --limit 100 --json displayTitle -q '.[].displayTitle' | grep -q " run $RUN to alpha "; then
            echo "build $RUN was already sent to alpha"; exit 0
          fi
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" -f source_repo="$SRC" -f run_id="$RUN" -f channel=alpha
          echo "::notice::sent build $RUN to alpha"
