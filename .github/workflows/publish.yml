name: Publish Zohara Package

on:
  repository_dispatch:
    types: [package-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Arch package name (e.g. zohara-settings)'
        required: true
      version:
        description: 'New version (e.g. 0.2.0)'
        required: true
      artifact_url:
        description: 'URL to the .pkg.tar.zst artifact'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      # ROOT CAUSE (confirmed 2026-09-23 via explicit diagnostics in run
      # 35848974626, after several wrong guesses -- GIT_DISCOVERY_ACROSS_
      # FILESYSTEM, safe.directory, --repo flags -- that treated the
      # symptom as a git-config/discovery quirk): archlinux:latest has no
      # git preinstalled. actions/checkout was the FIRST step, before
      # "Install build tools" ever ran pacman -S git, so checkout had no
      # git binary to clone with and silently fell back to downloading a
      # tarball via the REST API instead -- which has no .git directory
      # at all. `ls -la .git` in the diagnostic run: "No such file or
      # directory". Every later git/gh command that depended on being in
      # a real checkout was doomed from this first step, not from
      # anything about ownership or filesystem boundaries. Installing git
      # before checkout runs is what actually fixes it -- the discovery/
      # ownership env vars and flags added along the way are harmless but
      # were treating a different problem than the real one.
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed github-cli git base-devel zstd curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
            VER="${{ github.event.client_payload.version }}"
            RUN_ID="${{ github.event.client_payload.run_id }}"
            CH="${{ github.event.client_payload.channel || 'stable' }}"
            SRC_REPO="${{ github.event.client_payload.source_repo }}"
          else
            PKG="${{ github.event.inputs.package_name }}"
            VER="${{ github.event.inputs.version }}"
            RUN_ID=""
            CH="${{ github.event.inputs.channel }}"
            SRC_REPO="Zohaib8090/zohara-settings"
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_repo=$SRC_REPO" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $PKG $VER to channel $CH"

      - name: Determine release tag
        id: release_info
        run: |
          CH="${{ steps.inputs.outputs.channel }}"
          if [ "$CH" = "stable" ]; then
            TAG="stable"
          else
            TAG="channel-$CH"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download the .pkg.tar.zst from artifact
        id: download
        env:
          RUN_ID: ${{ steps.inputs.outputs.run_id }}
          SRC_REPO: ${{ steps.inputs.outputs.source_repo }}
          ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
          PKG_FILENAME_HINT: ${{ github.event.client_payload.pkg_filename }}
          # Verified working (run 35847279565, 2026-09-23): the default
          # GITHUB_TOKEN, though nominally scoped to this repo, is enough
          # to read a *public* repo's workflow-run artifacts cross-repo --
          # unlike writes, GitHub doesn't gate reading public Actions data
          # behind per-repo token scoping. zohara-settings/zohara-apps are
          # both public, so this works with no extra secret. An earlier
          # version of this step required a new SOURCE_REPO_TOKEN PAT,
          # which was unnecessary and untested; if any source repo is ever
          # made private, that assumption breaks and a PAT would be needed
          # again.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "::error::No run_id provided, cannot download artifact"
            exit 1
          fi

          echo "Downloading artifact from run $RUN_ID in $SRC_REPO..."

          if [ -n "$ARTIFACT_NAME" ]; then
            # Fetch only the named artifact, not every artifact the run
            # produced -- a source repo whose run uploads more than one
            # .pkg.tar.zst (zohara-apps: all four crates in one artifact)
            # would otherwise leave which package ends up published to
            # pure luck ("head -1" of whatever `find` happens to list
            # first), regardless of which package_name was dispatched.
            gh run download "$RUN_ID" --repo "$SRC_REPO" --name "$ARTIFACT_NAME" --dir /tmp || {
              echo "::error::Failed to download artifact '$ARTIFACT_NAME' from run $RUN_ID"
              exit 1
            }
          else
            gh run download "$RUN_ID" --repo "$SRC_REPO" --dir /tmp || {
              echo "::error::Failed to download artifacts from run $RUN_ID"
              exit 1
            }
          fi

          # Find the .pkg.tar.zst file. If the dispatch told us the exact
          # filename to expect (pkg_filename -- always set when
          # artifact_name is, since both come from the same multi-package
          # build), require that one specifically instead of "whichever
          # sorts first".
          if [ -n "$PKG_FILENAME_HINT" ]; then
            PKG_FILE=$(find /tmp -name "$PKG_FILENAME_HINT" -type f | head -1)
          else
            PKG_FILE=$(find /tmp -name "*.pkg.tar.zst" -type f | head -1)
          fi

          if [ -z "$PKG_FILE" ]; then
            echo "::error::No matching .pkg.tar.zst found in downloaded artifacts"
            ls -la /tmp
            exit 1
          fi

          # Keep the real filename (not a generic "package.pkg.tar.zst").
          # repo-add records this exact name inside zohara.db, and pacman
          # fetches "<Server>/<that name>" to install it -- a renamed-on-
          # upload package would 404 the moment a client tried to install
          # it. It also has to survive multiple packages publishing to the
          # same release without clobbering each other.
          PKG_FILENAME="$(basename "$PKG_FILE")"
          cp "$PKG_FILE" "$PKG_FILENAME"
          echo "pkg_filename=$PKG_FILENAME" >> "$GITHUB_OUTPUT"

          # Validate file
          FILE_SIZE=$(stat -c%s "$PKG_FILENAME" 2>/dev/null || stat -f%z "$PKG_FILENAME")
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "::error::Package file too small ($FILE_SIZE bytes)"
            exit 1
          fi

          echo "✓ Downloaded package ($FILE_SIZE bytes)"
          ls -lh "$PKG_FILENAME"
          tar -tf "$PKG_FILENAME" | head -10

      - name: Get or create channel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release_info.outputs.tag }}
          CHANNEL: ${{ steps.inputs.outputs.channel }}
        run: |
          REL_ID=$(gh release view "$TAG" --repo "$REPO" --json id -q '.id' 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then
            PRE=$([ "$CHANNEL" != "stable" ] && echo "--prerelease" || echo "")
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Zohara Packages — $CHANNEL" \
              --notes "Auto-managed Arch package repository for the **$CHANNEL** channel." \
              $PRE
            echo "✓ Created release $TAG"
          else
            echo "✓ Release $TAG already exists"
          fi

      - name: Download every existing asset from the release
        env:
          # This step had NO GH_TOKEN at all before -- gh silently fell
          # back to whatever ambient auth (usually none) the container
          # had, `gh release download` failed every time, and the `2>/dev/null
          # || ...` swallowed it into "this is the first publish" on
          # every single run. Combined with the missing --repo above,
          # this step could never have actually downloaded anything.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          mkdir -p repo
          # Pull down the current db AND every previously published package,
          # not just zohara.db. repo-add only ever sees the .pkg.tar.zst
          # files sitting next to the db it's given -- it does not read the
          # db's own file list to fetch anything -- so skipping this step
          # (the previous version of this workflow did) meant every publish
          # replaced the whole repo with just the one package being added.
          if gh release download "$TAG" --repo "$REPO" --dir repo 2>/dev/null; then
            echo "✓ Downloaded existing release assets:"
            ls -la repo
          else
            echo "ℹ No existing release assets; this is the first publish to $TAG"
          fi
          # Old db copies may exist under other names from before this
          # workflow was fixed (zohara.db.tar.zst from zohara-hub's
          # publisher, which also uses the wrong compression extension for
          # what pacman.conf's [zohara] section expects -- Server + "/zohara.db",
          # no suffix). Drop them: repo-add below rebuilds zohara.db.tar.gz
          # from every *.pkg.tar.zst file actually in repo/, which makes the
          # rebuild correct regardless of what any previous db said.
          rm -f repo/zohara.db repo/zohara.db.tar.gz repo/zohara.db.tar.zst \
                repo/zohara.db.tar.xz repo/zohara.files* repo/*.sig

      - name: Run repo-add to merge the new package
        env:
          PKG_FILENAME: ${{ steps.download.outputs.pkg_filename }}
        run: |
          cp "$PKG_FILENAME" "repo/$PKG_FILENAME"
          cd repo
          # Rebuilds the db from every package actually present, not just
          # the one just downloaded -- see the previous step for why a db
          # merge that only looked at one file at a time kept losing every
          # other package that had ever been published to this channel.
          shopt -s nullglob
          repo-add zohara.db.tar.gz ./*.pkg.tar.zst
          # repo-add creating a brand-new db (first publish to a channel)
          # also creates zohara.db as a symlink -> zohara.db.tar.gz itself
          # (confirmed: run 35847890269 failed here with "cp:
          # 'zohara.db.tar.gz' and 'zohara.db' are the same file"). `rm -f`
          # first so this is a real regular-file copy either way -- gh
          # release upload uploads a symlink's target transparently, so the
          # asset content would have been fine, but a stray symlink among
          # the uploaded files is fragile for no benefit.
          rm -f zohara.db
          cp zohara.db.tar.gz zohara.db
          echo "✓ repo-add completed"
          echo "--- Package database now contains ---"
          tar -tf zohara.db | grep -v '/$' | grep -v '/desc$\|/files$' || true

      - name: Upload updated files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          # Delete stray db assets under names this workflow doesn't
          # produce (e.g. zohara.db.tar.zst, left by an older/other
          # publisher) so pacman can't ever fetch a stale one by accident.
          for stale in zohara.db.tar.zst zohara.db.tar.xz; do
            gh release delete-asset "$TAG" "$stale" --repo "$REPO" -y 2>/dev/null || true
          done
          cd repo
          # --clobber has an internal race (confirmed, run 35848239773: a
          # republish to the same tag 404'd deleting an asset id gh's own
          # --clobber had just listed). A from-scratch delete-then-plain-
          # upload was tried as a fix but is worse: `gh release
          # delete-asset -y` failed silently under `2>/dev/null || true`
          # (confirmed, run 35848546972 -- "asset under the same name
          # already exists" on the immediately following plain upload, so
          # the deletes never actually took), and there's no reason to
          # trust that pattern once removed. Simplest correct fix: keep
          # --clobber (it works -- every run through this workflow except
          # the one that hit the race has used it successfully) and retry
          # once on failure, since the underlying issue is a transient
          # race, not something this workflow's own inputs control.
          if ! gh release upload "$TAG" ./* --repo "$REPO" --clobber; then
            echo "::warning::upload failed, retrying once after a short delay (see commit message for why)"
            sleep 5
            gh release upload "$TAG" ./* --repo "$REPO" --clobber
          fi
          echo "✓ Uploaded database and all packages to release"

      - name: Patch apps.json with the new package version
        env:
          PKG: ${{ steps.inputs.outputs.package }}
          VER: ${{ steps.inputs.outputs.version }}
          TAG: ${{ steps.release_info.outputs.tag }}
          PKG_FILENAME: ${{ steps.download.outputs.pkg_filename }}
        run: |
          python3 - <<'PYEOF'
          # NOTE: this heredoc is single-quoted ('PYEOF'), which is
          # deliberate -- it stops bash from touching the python source at
          # all (an f-string like f"{pkg}.svg" would otherwise be bash
          # variable-substitution syntax to an *unquoted* heredoc). That
          # means "$PKG"/"$VER" below must be read from os.environ, not
          # written as literal shell interpolation -- the previous version
          # of this file wrote pkg = "$PKG" here, which is quoted-heredoc
          # literal text, not a substitution, so apps.json was patched with
          # the four literal characters $PKG as the id every single run.
          import json, os, datetime
          pkg = os.environ["PKG"]
          ver = os.environ["VER"]
          tag = os.environ["TAG"]
          pkg_filename = os.environ["PKG_FILENAME"]
          today = datetime.date.today().isoformat()
          download_url = f"https://github.com/Zohaib8090/zohara-packages/releases/download/{tag}/{pkg_filename}"

          with open("apps.json") as f:
              data = json.load(f)

          entry = next((a for a in data["apps"] if a["id"] == pkg or a.get("package") == pkg), None)

          if entry is None:
              entry = {
                  "id": pkg,
                  "name": pkg.replace("-", " ").title(),
                  "publisher": "Zohara OS Team",
                  "description": f"{pkg} — published via the Zohara Packages channel.",
                  "category": "System",
                  "icon_url": f"https://raw.githubusercontent.com/Zohaib8090/{pkg}/main/data/icons/scalable/apps/{pkg}.svg",
                  "type": "pacman",
                  "package": pkg,
                  "current_version": ver,
                  "versions": [{
                      "version": ver,
                      "release_date": today,
                      "download_url": download_url,
                      "changelog": f"Auto-published from {pkg} v{ver}"
                  }]
              }
              data["apps"].append(entry)
          else:
              entry["current_version"] = ver
              ver_entry = next((v for v in entry["versions"] if v["version"] == ver), None)
              if ver_entry is None:
                  entry["versions"].insert(0, {
                      "version": ver,
                      "release_date": today,
                      "download_url": download_url,
                      "changelog": f"Auto-published from {pkg} v{ver}"
                  })
                  entry["versions"] = entry["versions"][:10]
              else:
                  ver_entry["release_date"] = today
                  ver_entry["download_url"] = download_url

          with open("apps.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"✓ Updated apps.json: {pkg} -> {ver}")
          PYEOF

      - name: Commit and push apps.json
        run: |
          git config user.name "Zohara Packages Bot"
          git config user.email "packages-bot@zohara.local"
          git add apps.json
          if git diff --cached --quiet; then
            echo "ℹ No apps.json changes"
          else
            git commit -m "apps: bump ${{ steps.inputs.outputs.package }} to ${{ steps.inputs.outputs.version }}"
            git push origin main
            echo "✓ Pushed apps.json"
          fi
