name: Publish Zohara Package

on:
  repository_dispatch:
    types: [package-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Arch package name (e.g. zohara-settings)'
        required: true
      version:
        description: 'New version (e.g. 0.2.0)'
        required: true
      artifact_url:
        description: 'URL to the .pkg.tar.zst artifact'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed github-cli git base-devel zstd curl

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
            VER="${{ github.event.client_payload.version }}"
            RUN_ID="${{ github.event.client_payload.run_id }}"
            CH="${{ github.event.client_payload.channel || 'stable' }}"
            SRC_REPO="${{ github.event.client_payload.source_repo }}"
          else
            PKG="${{ github.event.inputs.package_name }}"
            VER="${{ github.event.inputs.version }}"
            RUN_ID=""
            CH="${{ github.event.inputs.channel }}"
            SRC_REPO="Zohaib8090/zohara-settings"
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_repo=$SRC_REPO" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $PKG $VER to channel $CH"

      - name: Determine release tag
        id: release_info
        run: |
          CH="${{ steps.inputs.outputs.channel }}"
          if [ "$CH" = "stable" ]; then
            TAG="stable"
          else
            TAG="channel-$CH"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download the .pkg.tar.zst from artifact
        env:
          RUN_ID: ${{ steps.inputs.outputs.run_id }}
          SRC_REPO: ${{ steps.inputs.outputs.source_repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "::error::No run_id provided, cannot download artifact"
            exit 1
          fi

          echo "Downloading artifact from run $RUN_ID in $SRC_REPO..."

          # Download all artifacts from the run
          gh run download "$RUN_ID" \
            --repo "$SRC_REPO" \
            --dir /tmp || {
            echo "::error::Failed to download artifacts from run $RUN_ID"
            exit 1
          }

          # Find the .pkg.tar.zst file
          PKG_FILE=$(find /tmp -name "*.pkg.tar.zst" -type f | head -1)

          if [ -z "$PKG_FILE" ]; then
            echo "::error::No .pkg.tar.zst found in downloaded artifacts"
            ls -la /tmp
            exit 1
          fi

          echo "✓ Found package: $PKG_FILE"
          cp "$PKG_FILE" package.pkg.tar.zst

          # Validate file
          FILE_SIZE=$(stat -c%s package.pkg.tar.zst 2>/dev/null || stat -f%z package.pkg.tar.zst)
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "::error::Package file too small ($FILE_SIZE bytes)"
            exit 1
          fi

          echo "✓ Downloaded package ($FILE_SIZE bytes)"
          ls -lh package.pkg.tar.zst
          tar -tf package.pkg.tar.zst | head -10

      - name: Get or create channel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          CHANNEL: ${{ steps.inputs.outputs.channel }}
        run: |
          REL_ID=$(gh release view "$TAG" --json id -q '.id' 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then
            PRE=$([ "$CHANNEL" != "stable" ] && echo "--prerelease" || echo "")
            gh release create "$TAG" \
              --title "Zohara Packages — $CHANNEL" \
              --notes "Auto-managed Arch package repository for the **$CHANNEL** channel." \
              $PRE
            echo "✓ Created release $TAG"
          else
            echo "✓ Release $TAG already exists"
          fi

      - name: Download current zohara.db from the release
        env:
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          if gh release download "$TAG" --pattern 'zohara.db' --dir . 2>/dev/null; then
            echo "✓ Downloaded existing zohara.db"
          else
            echo "ℹ No existing zohara.db; repo-add will create one"
          fi

      - name: Run repo-add to merge the new package
        run: |
          repo-add --new --remove zohara.db.tar.gz package.pkg.tar.zst
          [ -f zohara.db ] || cp zohara.db.tar.gz zohara.db
          [ -f zohara.db.sig ] || true
          echo "✓ repo-add completed"
          echo "--- Package database contents ---"
          tar -tf zohara.db | head -20

      - name: Upload updated files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            package.pkg.tar.zst \
            zohara.db \
            zohara.db.tar.gz \
            --clobber
          echo "✓ Uploaded package and database to release"

      - name: Patch apps.json with the new package version
        env:
          PKG: ${{ steps.inputs.outputs.package }}
          VER: ${{ steps.inputs.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import json, datetime
          pkg = "$PKG"
          ver = "$VER"
          today = datetime.date.today().isoformat()

          with open("apps.json") as f:
              data = json.load(f)

          entry = next((a for a in data["apps"] if a["id"] == pkg or a.get("package") == pkg), None)

          if entry is None:
              entry = {
                  "id": pkg,
                  "name": pkg.replace("-", " ").title(),
                  "publisher": "Zohara OS Team",
                  "description": f"{pkg} — published via the Zohara Packages channel.",
                  "category": "System",
                  "icon_url": f"https://raw.githubusercontent.com/Zohaib8090/{pkg}/main/data/icons/scalable/apps/{pkg}.svg",
                  "type": "pacman",
                  "package": pkg,
                  "current_version": ver,
                  "versions": [{
                      "version": ver,
                      "release_date": today,
                      "download_url": f"https://github.com/Zohaib8090/zohara-packages/releases/download/stable/{pkg}-{ver}-1-x86_64.pkg.tar.zst",
                      "changelog": f"Auto-published from {pkg} v{ver}"
                  }]
              }
              data["apps"].append(entry)
          else:
              entry["current_version"] = ver
              ver_entry = next((v for v in entry["versions"] if v["version"] == ver), None)
              if ver_entry is None:
                  entry["versions"].insert(0, {
                      "version": ver,
                      "release_date": today,
                      "download_url": f"https://github.com/Zohaib8090/zohara-packages/releases/download/stable/{pkg}-{ver}-1-x86_64.pkg.tar.zst",
                      "changelog": f"Auto-published from {pkg} v{ver}"
                  })
                  entry["versions"] = entry["versions"][:10]
              else:
                  ver_entry["release_date"] = today

          with open("apps.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"✓ Updated apps.json: {pkg} -> {ver}")
          PYEOF

      - name: Commit and push apps.json
        run: |
          git config user.name "Zohara Packages Bot"
          git config user.email "packages-bot@zohara.local"
          git add apps.json
          if git diff --cached --quiet; then
            echo "ℹ No apps.json changes"
          else
            git commit -m "apps: bump ${{ steps.inputs.outputs.package }} to ${{ steps.inputs.outputs.version }}"
            git push origin main
            echo "✓ Pushed apps.json"
          fi
