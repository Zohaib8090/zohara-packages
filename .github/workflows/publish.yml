name: Publish Zohara Package

# Publishes the package(s) of one successful source-repo build run to a channel release in this repository.
#
# Started by:
#   * repository_dispatch "package-published": the source repo's own build workflow, and the admin site
#     (zohara-updates-system), send  run_id, source_repo, channel  and optionally  artifact_name, pkg_filename
#   * workflow_dispatch (the "Run workflow" button): the same inputs by hand
#
# Everything the run needs is checked first (scripts/validate-publish-inputs.sh: allowed source repo, channel,
# plain characters only; scripts/verify-source-run.sh: the run succeeded, came from a push or manual start on the
# right branch of that repository itself). The package name and version are read from the package file
# (scripts/read-pkginfo.sh), not taken from the request. Values reach the scripts as environment variables, never
# pasted into script text.
#
# Several publishes may run at once (zohara-apps sends one per package). The release database is rebuilt from
# every package in the release, then re-read after upload to confirm it holds everything this run published;
# if another run overwrote it in between, the merge is done again. See docs in README.md.
#
# apps.json (the Store catalog) is only touched by stable publishes: an alpha or beta test must not change what
# stable users see.

on:
  repository_dispatch:
    types: [package-published]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository'
        required: true
        default: 'Zohaib8090/zohara-settings'
        type: choice
        options:
          - Zohaib8090/zohara-settings
          - Zohaib8090/zohara-apps
          - Zohaib8090/zohara
      run_id:
        description: 'Run id of a successful build in that repository'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - stable
      artifact_name:
        description: 'Artifact name (empty = every artifact of the run)'
        required: false
      pkg_filename:
        description: 'Only this package file (empty = every package in the artifact)'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      # One place that reads the trigger; every later step uses these as environment variables.
      EVENT: ${{ github.event_name }}
      CHANNEL: ${{ github.event.client_payload.channel || github.event.inputs.channel || 'stable' }}
      SRC_REPO: ${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}
      RUN_ID: ${{ github.event.client_payload.run_id || github.event.inputs.run_id }}
      ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name || github.event.inputs.artifact_name }}
      PKG_FILENAME: ${{ github.event.client_payload.pkg_filename || github.event.inputs.pkg_filename }}
      PKG: ${{ github.event.client_payload.package_name }}
      VER: ${{ github.event.client_payload.version }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # archlinux:latest has no git, and actions/checkout without git falls back to a tarball with no .git
      # (found 2026-09-23). Install the tools before checkout.
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed github-cli git base-devel zstd curl jq

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the inputs
        run: bash scripts/validate-publish-inputs.sh

      - name: Check the source run
        run: bash scripts/verify-source-run.sh

      - name: Download the package(s) from the run's artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact incoming
          # The default GITHUB_TOKEN can read the Actions artifacts of public repositories, which the allowed
          # source repositories are (verified 2026-09-23). If one is ever made private, a token is needed.
          if [ -n "$ARTIFACT_NAME" ]; then
            gh run download "$RUN_ID" --repo "$SRC_REPO" --name "$ARTIFACT_NAME" --dir /tmp/artifact
          else
            gh run download "$RUN_ID" --repo "$SRC_REPO" --dir /tmp/artifact
          fi
          if [ -n "$PKG_FILENAME" ]; then
            find /tmp/artifact -type f -name "$PKG_FILENAME" > /tmp/found.txt
          else
            # Debug-symbol packages (<name>-debug) are not for users; skip them unless one was asked for by name.
            find /tmp/artifact -type f -name '*.pkg.tar.zst' ! -name '*-debug-[0-9]*' | sort > /tmp/found.txt
          fi
          [ -s /tmp/found.txt ] || { echo "::error::no matching .pkg.tar.zst in the run's artifacts"; ls -laR /tmp/artifact; exit 1; }
          : > published.tsv
          while read -r f; do
            size=$(stat -c%s "$f")
            [ "$size" -ge 1000 ] || { echo "::error::$(basename "$f") is too small ($size bytes)"; exit 1; }
            read -r name ver < <(bash scripts/read-pkginfo.sh "$f")
            # If the request named a package or version, the file must agree.
            if [ -n "$PKG" ] && [ "$(wc -l < /tmp/found.txt)" = 1 ] && [ "$name" != "$PKG" ]; then
              echo "::error::the request says package '$PKG' but the file is '$name'"; exit 1
            fi
            if [ -n "$VER" ] && [ "$(wc -l < /tmp/found.txt)" = 1 ] && [ "${ver%-*}" != "$VER" ]; then
              echo "::error::the request says version '$VER' but the file is '${ver%-*}'"; exit 1
            fi
            # Keep the real file name: the database records it and pacman downloads exactly that name.
            base=$(basename "$f")
            cp "$f" "incoming/$base"
            printf '%s\t%s\t%s\n' "$base" "$name" "${ver%-*}" >> published.tsv
            echo "found $name ${ver%-*} ($size bytes) -> $base"
          done < /tmp/found.txt
          echo "::notice::Publishing $(wc -l < published.tsv) package(s) to $CHANNEL"

      - name: Get or create the channel release
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "stable" ]; then TAG=stable; else TAG="channel-$CHANNEL"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            PRE=$([ "$CHANNEL" != "stable" ] && echo "--prerelease" || echo "")
            gh release create "$TAG" --repo "$REPO" --title "Zohara Packages — $CHANNEL" \
              --notes "Auto-managed Arch package repository for the **$CHANNEL** channel." $PRE \
              || gh release view "$TAG" --repo "$REPO" >/dev/null   # another run may have created it first
            echo "created release $TAG"
          fi

      - name: Merge into the channel database, upload, and check it stuck
        run: |
          set -euo pipefail
          # pacman fetches "<section name>.db": [zohara-stable] asks for zohara-stable.db. Every publish therefore
          # uploads the database under zohara.db AND zohara-$CHANNEL.db (plus .files copies). A release with only
          # zohara.db made `pacman -Sy` fail with a 404 on every installed system (found 2026-09-30).
          attempt=1
          while :; do
            rm -rf repo check; mkdir repo check
            gh release download "$TAG" --repo "$REPO" --dir repo 2>/dev/null || echo "no existing assets: first publish to $TAG"
            # repo-add only sees the .pkg.tar.zst files next to the database it builds, so the database is rebuilt
            # from every package in the release, not only the new ones. Stale database copies go first.
            rm -f repo/zohara.db repo/zohara.db.tar.gz repo/zohara.db.tar.zst repo/zohara.db.tar.xz repo/zohara.files* repo/*.sig \
                  "repo/zohara-$CHANNEL.db" "repo/zohara-$CHANNEL.db.tar.gz" "repo/zohara-$CHANNEL.files" "repo/zohara-$CHANNEL.files.tar.gz"
            cp incoming/*.pkg.tar.zst repo/
            ( cd repo
              shopt -s nullglob
              # -n: when two versions of one package are present, keep the newer one
              repo-add -n zohara.db.tar.gz ./*.pkg.tar.zst
              rm -f zohara.db zohara.files
              cp zohara.db.tar.gz zohara.db
              for ext in db files; do
                [ -e "zohara.$ext.tar.gz" ] || continue
                cp -L "zohara.$ext.tar.gz" "zohara-$CHANNEL.$ext.tar.gz"
                cp -L "zohara.$ext.tar.gz" "zohara-$CHANNEL.$ext"
              done )
            for stale in zohara.db.tar.zst zohara.db.tar.xz; do
              gh release delete-asset "$TAG" "$stale" --repo "$REPO" -y 2>/dev/null || true
            done
            # --clobber can hit a transient race on a republish; retry once.
            ( cd repo
              gh release upload "$TAG" ./* --repo "$REPO" --clobber || { echo "::warning::upload failed, retrying once"; sleep 5; gh release upload "$TAG" ./* --repo "$REPO" --clobber; } )
            # Did our packages survive? Another run may have uploaded its own database a moment after ours.
            gh release download "$TAG" --repo "$REPO" --pattern "zohara-$CHANNEL.db" --dir check --clobber
            missing=0
            while IFS=$'\t' read -r base name ver; do
              entry="${base%-*.pkg.tar.zst}"      # zohara-voice-1.9.4-1-x86_64.pkg.tar.zst -> zohara-voice-1.9.4-1
              if ! tar -tzf "check/zohara-$CHANNEL.db" | grep -qx "$entry/"; then missing=1; echo "not in the database yet: $entry"; fi
            done < published.tsv
            [ "$missing" = 0 ] && break
            [ "$attempt" -lt 6 ] || { echo "::error::the database still lacks our package(s) after $attempt tries"; exit 1; }
            attempt=$((attempt+1)); echo "another publish overwrote the database; merging again (try $attempt)"; sleep $((RANDOM % 10 + 5))
          done
          echo "--- $CHANNEL database now lists ---"
          tar -tzf "check/zohara-$CHANNEL.db" | grep -v '/desc$\|/files$' | sed 's#/$##' | sort

      - name: Mirror to OCI Object Storage (main download location)
        # GitHub Releases stays the address installed systems use until their pacman.conf is changed; OCI is the
        # main store. A failure here is reported as a warning and does not block the stable catalog update.
        continue-on-error: true
        env:
          OCI_PACKAGES_PAR: ${{ secrets.OCI_PACKAGES_PAR }}
          OCI_PUBLIC_BASE: https://objectstorage.ap-mumbai-1.oraclecloud.com/n/bm27e3oxmp04/b/zohara-packages/o/
        run: |
          if [ -z "$OCI_PACKAGES_PAR" ]; then
            echo "::warning::OCI_PACKAGES_PAR is not set; skipping the OCI copy (GitHub Releases still has everything)"; exit 0
          fi
          bash scripts/oci-upload.sh "$TAG" repo

      - name: Update the Store catalog (apps.json), stable only
        if: env.CHANNEL == 'stable'
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          for attempt in 1 2 3 4; do
            # Start from the current file every time, so two publishes cannot overwrite each other's change.
            gh api "repos/$REPO/contents/apps.json" > apps.meta.json
            sha=$(jq -r .sha apps.meta.json)
            jq -r .content apps.meta.json | base64 -d > apps.json
            while IFS=$'\t' read -r base name ver; do
              url="https://github.com/$REPO/releases/download/$TAG/$base"
              jq --arg pkg "$name" --arg ver "$ver" --arg url "$url" --arg today "$today" '
                def ventry: {version: $ver, release_date: $today, download_url: $url,
                             changelog: ("Auto-published from " + $pkg + " v" + $ver)};
                if any(.apps[]; .id == $pkg or .package == $pkg) then
                  .apps |= map(
                    if .id == $pkg or .package == $pkg then
                      .current_version = $ver
                      | if any(.versions[]; .version == $ver) then
                          .versions |= map(if .version == $ver then .release_date = $today | .download_url = $url else . end)
                        else
                          .versions = ([ventry] + .versions)[:10]
                        end
                    else . end)
                else
                  .apps += [{
                    id: $pkg,
                    name: ($pkg | gsub("-"; " ")),
                    publisher: "Zohara OS Team",
                    description: ($pkg + " — published via the Zohara Packages channel."),
                    category: "System",
                    icon_url: ("https://raw.githubusercontent.com/Zohaib8090/" + $pkg + "/main/data/icons/scalable/apps/" + $pkg + ".svg"),
                    type: "pacman",
                    package: $pkg,
                    current_version: $ver,
                    versions: [ventry]
                  }]
                end' apps.json > apps.json.new
              mv apps.json.new apps.json
              echo "apps.json: $name -> $ver"
            done < published.tsv
            msg="apps: bump $(cut -f2,3 published.tsv | tr '\t' ' ' | paste -sd, -)"
            # The Contents API needs no local .git (plain git failed in this container; see git history).
            if gh api "repos/$REPO/contents/apps.json" --method PUT -f message="$msg" -f content="$(base64 -w0 apps.json)" -f sha="$sha" >/dev/null; then
              echo "pushed apps.json"; exit 0
            fi
            echo "apps.json changed under us; trying again ($attempt)"; sleep $((RANDOM % 8 + 3))
          done
          echo "::error::could not update apps.json after 4 tries"; exit 1
